<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
</head>
<body>

<h1>Admin Dashboard</h1>

<p><a th:href="@{/admin/dashboard}">Refresh users</a></p>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Full name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Verified</th>
            <th>Created</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.fullName}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
            <td th:text="${user.emailVerified}"></td>
            <td th:text="${#dates.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:if="${user.role.name() != 'ADMIN'}">
                <form method="post" th:action="@{/admin/set-account-enabled}" style="display:inline">
                    <input type="hidden" name="_csrf" th:value="${csrfToken}" />
                    <input type="hidden" name="email" th:value="${user.email}" />
                    <input type="hidden" name="enabled" th:value="${!user.emailVerified}" />
                    <button type="submit" th:text="${user.emailVerified} ? 'Disable account' : 'Enable account'"></button>
                </form>
                <form method="post" th:action="@{/admin/delete-user/{id}(id=${user.id})}"
                      onsubmit="return confirm('Delete this user?')" style="display:inline">
                    <input type="hidden" name="_csrf" th:value="${csrfToken}" />
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>
<br><br>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Display Name</th>
            <th>Cliq ID</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="staff : ${staffList}">
            <td th:text="${staff.id}"></td>
            <td th:text="${staff.displayName}"></td>
            <td th:text="${staff.cliqUserId}"></td>
        </tr>
    </tbody>
</table>
<br><br>
<!--STAFF CREATION FORM-->
<div class="card-header bg-primary text-white text-center">
    <h4>Add a Staff Member</h4>
</div>
<form th:action="@{/admin/create-staff}" th:object="${newStaff}" method="post">

    <input type="hidden" name="_csrf" th:value="${csrfToken}" />

    <!-- Global (non-field) errors -->
    <div th:if="${#fields.hasGlobalErrors()}" class="mb-3">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="alert alert-danger text-center mb-0"></p>
    </div>

    <!-- Display Name Field -->
    <div class="mb-3">
        <label for="displayName" class="form-label">Display Name</label>
        <input type="text" id="displayName" th:field="*{displayName}" class="form-control" placeholder="Jane Doe" required />
    </div>

    <!-- Cliq ID Field -->
    <div class="mb-3">
        <label for="cliqUserId" class="form-label">Cliq ID</label>
        <input type="text" id="cliqUserId" th:field="*{cliqUserId}" class="form-control" placeholder="12345678" required />
        <div th:if="${#fields.hasErrors('cliqUserId')}" class="text-danger small mt-1">
            <p th:each="err : ${#fields.errors('cliqUserId')}" th:text="${err}" class="mb-0"></p>
        </div>
    </div>

    <!-- Submit Button -->
    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">Register</button>
    </div>                 
</form>

</body>
</html>
