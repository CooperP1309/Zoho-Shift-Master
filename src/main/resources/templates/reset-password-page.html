<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<main class="auth">
    <div class="card">
        <h1>Reset password</h1>
        <p class="muted">Station Master Notifier</p>

        <!-- Invalid or expired link -->
        <th:block th:if="${secretInvalid}">
            <div class="alert">
                <p>This password reset link is invalid or has expired.</p>
            </div>
            <p class="auth-footer"><a th:href="@{/auth/forgot-password}">Request a new link</a></p>
        </th:block>

        <!-- Reset success -->
        <th:block th:if="${resetSuccess}">
            <div class="alert alert-success">
                <p>Your password has been reset.</p>
            </div>
            <a class="button button-block" th:href="@{/auth/login-page}">Back to log in</a>
        </th:block>

        <!-- Reset Password Form -->
        <form th:if="${!secretInvalid and !resetSuccess}"
              th:action="@{/auth/reset-password/{secret}(secret=${secret})}"
              th:object="${user}" method="post">

            <input type="hidden" name="_csrf" th:value="${csrfToken}" />

            <!-- Global (non-field) errors -->
            <div class="alert" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div class="field">
                <label for="password">New password</label>
                <input type="password" id="password" th:field="*{password}" autocomplete="new-password" required autofocus />
                <p class="field-error" th:each="err : ${#fields.errors('password')}" th:text="${err}"></p>
            </div>

            <button type="submit" class="button-block">Reset password</button>
        </form>

        <!-- Link to Login -->
        <p class="auth-footer" th:if="${!secretInvalid and !resetSuccess}">
            <a th:href="@{/auth/login-page}">Back to log in</a>
        </p>
    </div>
</main>

</body>
</html>
