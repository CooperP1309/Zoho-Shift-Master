<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<main class="auth">
    <div class="card">
        <h1>Station Master Notifier</h1>
        <p class="muted">Log in to manage the roster.</p>

        <form th:action="@{/auth/login}" th:object="${user}" method="post">

            <input type="hidden" name="_csrf" th:value="${csrfToken}" />

            <!-- Global (non-field) errors -->
            <div class="alert" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" autocomplete="username" required autofocus />
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" autocomplete="current-password" required />
            </div>

            <button type="submit" class="button-block">Log in</button>
        </form>

        <div class="auth-links">
            <a th:href="@{/auth/forgot-password}">Forgot password?</a>
        </div>
    </div>
</main>

</body>
</html>
