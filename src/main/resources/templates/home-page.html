<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/home-page}">Station Master Notifier</a>
        <nav>
            <a th:href="@{/home-page}">Home</a>
            <a sec:authorize="hasAnyRole('USER', 'ADMIN')" th:href="@{/admin/dashboard}">Admin</a>
        </nav>
    </div>
</header>

<main class="container">
    <section class="card">
        <h1 th:text="${username != null} ? |Welcome back, ${username}| : 'Welcome back'">Welcome back</h1>
        <p class="muted">The station master for each two-hour shift is pinged in the Cliq channel when their shift starts.</p>

        <a sec:authorize="hasAnyRole('USER', 'ADMIN')" class="button" th:href="@{/admin/dashboard}">Open admin console</a>
    </section>
</main>

</body>
</html>
