<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<main class="auth">
    <div class="card">
        <h1>Forgot password</h1>
        <p class="muted">Enter your email and we'll send you a link to reset your password.</p>

        <!-- Forgot Password Form -->
        <form th:action="@{/auth/forgot-password}" th:object="${user}" method="post">

            <input type="hidden" name="_csrf" th:value="${csrfToken}" />

            <!-- Global (non-field) messages -->
            <div class="alert alert-success" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="name@example.com" autocomplete="email" required autofocus />
            </div>

            <button type="submit" class="button-block">Send reset link</button>
        </form>

        <p class="auth-footer"><a th:href="@{/auth/login-page}">Back to log in</a></p>
    </div>
</main>

</body>
</html>
