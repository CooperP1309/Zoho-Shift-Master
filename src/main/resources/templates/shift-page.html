<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shift Dashboard</title>
</head>
<body>

<div>
    <hr>
        <p>
            <a th:href="@{/home-page}">Go Back</a>
        </p>
    <hr>
</div>

<h1>Shift Dashboard</h1>

<p><a th:href="@{/shift/dashboard}">Refresh Shifts</a></p>

<h2>Weekly Roster</h2>

<p th:if="${message}" th:text="${message}" style="color: green"></p>
<p th:if="${error}" th:text="${error}" style="color: red"></p>

<!-- Each select is named slot-{DAY}-{HH:mm}; ShiftController.saveShifts parses these -->
<form id="roster-form" method="post" th:action="@{/shift/save}">
    <input type="hidden" name="_csrf" th:value="${csrfToken}" />
    <table border="1">
        <thead>
            <tr>
                <th>Time</th>
                <th th:each="day : ${days}"
                    th:text="${#strings.capitalize(#strings.toLowerCase(day.name()))}"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${rows}">
                <th th:text="${row.label}"></th>
                <td th:each="cell : ${row.cells}">
                    <select th:name="|slot-${cell.day}-${row.startTime}|">
                        <option value="" th:selected="${cell.staffId == null}">-- Unassigned --</option>
                        <option th:each="member : ${staff}"
                                th:value="${member.id}"
                                th:text="${member.displayName}"
                                th:selected="${member.id == cell.staffId}"></option>
                    </select>
                </td>
            </tr>
        </tbody>
    </table>
    <p><button type="submit">Save Roster</button></p>
</form>

<h2>Cover a Shift</h2>

<!-- ShiftController.queueCover; the next time this slot fires, the cover is notified instead -->
<details>
    <summary>Cover a shift</summary>
    <form method="post" th:action="@{/shift/cover}">
        <input type="hidden" name="_csrf" th:value="${csrfToken}" />
        <p>
            <label>Staff
                <select name="staffId" required>
                    <option value="">-- Select staff --</option>
                    <option th:each="member : ${staff}"
                            th:value="${member.id}"
                            th:text="${member.displayName}"></option>
                </select>
            </label>
            <label>Day
                <select name="day" required>
                    <option value="">-- Select day --</option>
                    <option th:each="day : ${days}"
                            th:value="${day.name()}"
                            th:text="${#strings.capitalize(#strings.toLowerCase(day.name()))}"></option>
                </select>
            </label>
            <label>Slot
                <select name="startTime" required>
                    <option value="">-- Select slot --</option>
                    <option th:each="slot : ${startTimes}"
                            th:value="${slot.startTime}"
                            th:text="${slot.label}"></option>
                </select>
            </label>
        </p>
        <p><button type="submit">Queue Cover</button></p>
    </form>
</details>

<h3>Queued Covers</h3>

<p th:if="${#lists.isEmpty(covers)}">No covers queued.</p>

<table border="1" th:unless="${#lists.isEmpty(covers)}">
    <thead>
        <tr>
            <th>Day</th>
            <th>Slot</th>
            <th>Covering</th>
            <th>Rostered</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="cover : ${covers}">
            <td th:text="${#strings.capitalize(#strings.toLowerCase(cover.day.name()))}"></td>
            <td th:text="${cover.label}"></td>
            <td th:text="${cover.staffName}"></td>
            <td th:text="${cover.rosteredName != null ? cover.rosteredName : '-- Unassigned --'}"></td>
            <td>
                <form method="post" th:action="@{/shift/cover/{id}/cancel(id=${cover.id})}">
                    <input type="hidden" name="_csrf" th:value="${csrfToken}" />
                    <button type="submit">Cancel</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

<h2>Staff</h2>

<table border="1">
    <thead>
        <tr>
            <th>Display Name</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="staff : ${staff}">
            <td th:text="${staff.displayName}"></td>
        </tr>
    </tbody>
</table>
</body>
</html>
