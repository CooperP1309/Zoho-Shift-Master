<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<main class="auth">
    <div class="card">
        <h1>Create an account</h1>
        <p class="muted">Station Master Notifier</p>

        <!-- Registration Result -->
        <div class="alert alert-success" th:if="${registrationSuccess}">
            <p>Verification email sent. Check your inbox to activate your account.</p>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/auth/register}" th:object="${user}" method="post">

            <input type="hidden" name="_csrf" th:value="${csrfToken}" />

            <!-- Global (non-field) errors -->
            <div class="alert" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div class="field">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" th:field="*{fullName}" placeholder="Jane Doe" autocomplete="name" required />
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="name@example.com" autocomplete="email" required />
                <p class="field-error" th:each="err : ${#fields.errors('email')}" th:text="${err}"></p>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" autocomplete="new-password" required />
                <p class="field-error" th:each="err : ${#fields.errors('password')}" th:text="${err}"></p>
            </div>

            <button type="submit" class="button-block">Create account</button>
        </form>

        <p class="auth-footer">Already have an account? <a th:href="@{/auth/login-page}">Log in</a></p>
    </div>
</main>

</body>
</html>
